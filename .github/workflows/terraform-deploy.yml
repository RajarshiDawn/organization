name: Terraform Deploy

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "deployment-code/**"
      - ".github/workflows/terraform-deploy.yml"

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: deployment-code

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: PROD

    env:
      ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:        ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID:  ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:         "true"
      ARM_USE_AZUREAD:      "true"

      TF_VAR_platform_landing_zone_name:            ${{ vars.TF_VAR_PLATFORM_LANDING_ZONE_NAME }}
      TF_VAR_platform_landing_zone_display_name:    ${{ vars.TF_VAR_PLATFORM_LANDING_ZONE_DISPLAY_NAME }}
      TF_VAR_application_landing_zone_name:         ${{ vars.TF_VAR_APPLICATION_LANDING_ZONE_NAME }}
      TF_VAR_application_landing_zone_display_name: ${{ vars.TF_VAR_APPLICATION_LANDING_ZONE_DISPLAY_NAME }}
      TF_VAR_application_landing_zone_children:     ${{ vars.TF_VAR_APPLICATION_LANDING_ZONE_CHILDREN }}
      TF_VAR_subscription_name:                     ${{ vars.TF_VAR_SUBSCRIPTION_NAME }}
      TF_VAR_alias_name:                            ${{ vars.TF_VAR_ALIAS_NAME }}
      TF_VAR_billing_scope_id:                      ${{ vars.TF_VAR_BILLING_SCOPE_ID }}
      TF_VAR_workload:                              ${{ vars.TF_VAR_WORKLOAD }}
      TF_VAR_tags:                                  ${{ vars.TF_VAR_TAGS }}
      TFSTATE_RESOURCE_GROUP:                       ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT:                      ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINERL:                           ${{ vars.TFSTATE_CONTAINER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id:              ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:               ${{ vars.AZURE_TENANT_ID }}
          subscription-id:         ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession:      false
          environment:              azurecloud
          allow-no-subscriptions:  false
          audience:                 api://AzureADTokenExchange

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ github.event.repository.name }}.tfstate"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: deployment-code/tfplan
          retention-days: 5

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan